description "Wien zu Fuss: Schrittdienst anstossen"
author "Sebastian"
start on EXT_APPS_STARTED
stop on stopping xsession
respawn
respawn limit 20 120

# Dieser Job startet den Schrittdienst nicht selbst, er stoesst ihn nur an
# -- dasselbe Muster wie beim WhatsApp-Backend auf diesem Geraet:
#
# Ein Job unter /etc/init/apps laeuft als uid 0, aber mit leerem
# Rechtesatz; jeder Kennungswechsel scheitert dort still, und als root
# gehoerten die Schrittdateien dann root. Der Sitzungs-D-Bus ist dagegen
# erreichbar, und ein darueber aktivierter Dienst laeuft als Besitzer des
# Busses, also als "user".
#
# --print-reply ist Pflicht: ohne das kehrt der Aufruf zurueck, bevor D-Bus
# die Aktivierung bearbeitet hat. Die Schleife ersetzt das respawn, das ein
# D-Bus-Dienst nicht hat: alle fuenf Minuten nachsehen, ob er noch laeuft.
script
    BUS=$(sed -n 's/.*DBUS_SESSION_BUS_ADDRESS=//p' /tmp/session_bus_address.user \
          | tr -d '";' | head -1)
    [ -n "$BUS" ] || exit 0
    export DBUS_SESSION_BUS_ADDRESS="$BUS"
    while true; do
        dbus-send --session --print-reply --dest=org.freedesktop.DBus \
            /org/freedesktop/DBus org.freedesktop.DBus.StartServiceByName \
            string:org.smatkovi.WienZuFuss.Schritte uint32:0 >/dev/null 2>&1
        sleep 300
    done
end script
