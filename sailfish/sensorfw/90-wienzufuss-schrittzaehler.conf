; Von Wien zu Fuss (wienzufuss-RPM): schaltet den Schrittzaehler des
; Sensorchips frei. Manche Geraete haben ihn im Android-Unterbau
; (android.hardware.sensor.stepcounter), sensorfw blendet ihn aber aus --
; etwa das Jolla Phone 2026. Das RPM legt diese Datei nur dann an und
; loescht sie beim Entfernen der App wieder.
[plugins]
stepcounteradaptor = hybrisstepcounteradaptor

[available]
stepcountersensor=True
