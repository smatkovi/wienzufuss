[package]
name = "wzf-dienst"
version = "0.1.3"
edition = "2021"

# Die Netzseite von Wien zu Fuss fuer MeeGo Harmattan und Sailfish OS:
# liest Anfragen von stdin, spricht mit Firebase und dem Backend, schreibt
# Antworten nach stdout. Zeilenformat wie bei den Bahn-Ports, siehe
# meego/src/Dienst.h. Mit "wzf-dienst sync" laedt es einmal die Schritte hoch
# und endet -- so ruft es der Schrittdienst im Hintergrund auf.

[dependencies]
# TLS ueber native-tls -> OpenSSL, statisch mitkompiliert: Qt 4.7 auf dem N9
# kann kein TLS 1.2. Auf Sailfish waere das System-OpenSSL da, aber ein
# statisches Binary laeuft dort ohne Ruecksicht auf dessen Fassung.
ureq = { version = "2.12", default-features = false, features = ["native-tls", "gzip"] }
native-tls = { version = "0.2", features = ["vendored"] }
url = "2"
serde_json = "1"
# Beschreibungen von Gutscheinen und Challenges sind Markdown (die Android-
# App bringt commonmark mit); QML zeigt eine HTML-Teilmenge.
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
